<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#08070a" />
<title>Hpyrland — Links</title>
<meta name="description" content="Hpyrland — Arch Linux, Hyprland, and everything in between." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='90'>⬡</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer">

<!--
  HPYRLAND — LINKS PAGE
  ---------------------------------------------------------------
  Built from scratch (original CSS/SVG), styled to match the
  "Sakura & Black" theme + hexagon mark already on hpyrland.github.io.

  Quick customization map:
   - Real photo instead of the hex mark → swap the <div class="avatar"><svg>
     for <img src="you.jpg" alt="Hpyrland">
   - Bio text                → <p class="bio">
   - "Now playing" line      → .status-text
   - Badge label             → .badge.arch (currently "ARCH")
   - Social links            → <nav class="socials"> hrefs (Discord/Twitch are "#")
   - Track title / artist    → .track-title / .track-artist
   - Every color             → CSS variables in :root below
-->

<style>
  :root{
    --bg-0:#08070a;
    --bg-1:#131015;
    --bg-2:#1c171d;
    --card-bg: rgba(19,15,17,0.55);
    --card-border: rgba(255,200,215,0.12);
    --sakura:#ffb3c6;
    --sakura-deep:#e2839c;
    --sakura-pale:#ffe1e9;
    --white:#f7f1f2;
    --muted:#a3919a;
    --muted-dim:#786872;
    --online:#8ee6a0;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:100%; }
  body{
    min-height:100vh;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--white);
    background:
      radial-gradient(ellipse 120% 70% at 50% -8%, #241a22 0%, #0d0a0e 45%, #050405 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 20px 48px;
    position:relative;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{ background:var(--sakura); color:var(--bg-0); }

  /* ---------- ambient background layers ---------- */
  .grain{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .stars{ position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .star{
    position:absolute; background:#fff; border-radius:50%;
    box-shadow:0 0 4px rgba(255,255,255,.6);
    animation-name:twinkle; animation-iteration-count:infinite; animation-timing-function:ease-in-out;
  }
  .petals{ position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .petal{
    position:absolute; top:-6%; width:9px; height:9px; opacity:0;
    background:radial-gradient(circle at 30% 30%, var(--sakura-pale), var(--sakura) 60%, var(--sakura-deep));
    border-radius:60% 40% 55% 45% / 55% 45% 60% 40%;
    animation-name:petalFall; animation-iteration-count:infinite; animation-timing-function:linear;
  }
  svg.mountains{
    position:fixed; left:0; bottom:0; width:100%; height:26vh; min-height:170px; max-height:260px;
    z-index:1; pointer-events:none;
  }
  .mtn-back{ fill:#1a1219; }
  .mtn-front{ fill:#08050a; }

  /* ---------- layout ---------- */
  .profile-wrap{
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    width:100%; max-width:420px; margin:0 auto;
  }

  .card{
    width:100%;
    background:var(--card-bg);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--card-border);
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(255,179,198,.12);
    opacity:0; transform:translateY(16px) scale(.98);
    animation:cardIn .8s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .profile-card{ padding:0 26px 22px; text-align:center; }
  .player-card{
    padding:14px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    animation-delay:.15s;
  }

  /* ---------- avatar ---------- */
  .avatar-wrap{ display:flex; justify-content:center; margin-top:-48px; margin-bottom:12px; }
  .avatar-box{ position:relative; width:104px; height:104px; }
  .avatar-ring{
    width:100%; height:100%; border-radius:50%; padding:3px;
    background:conic-gradient(from 180deg, var(--sakura), var(--sakura-pale), var(--sakura-deep), var(--sakura));
    box-shadow:0 0 30px rgba(255,179,198,.35);
  }
  .avatar{
    width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #241a20, #0c0a0c 70%);
    display:flex; align-items:center; justify-content:center;
  }
  .hex-mark{ width:44%; height:44%; }
  .hex-mark polygon{
    fill:none; stroke:var(--sakura); stroke-width:5; stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(255,179,198,.6));
  }
  .avatar-dot{
    position:absolute; bottom:2px; right:2px; width:16px; height:16px; border-radius:50%;
    background:var(--online); border:3px solid var(--bg-1);
    box-shadow:0 0 8px var(--online); animation:pulseDot 2.4s ease-in-out infinite;
  }

  .username{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(1.5rem, 5vw, 1.9rem); letter-spacing:.3px;
    text-shadow:0 0 16px rgba(255,179,198,.35);
    animation:glowPulse 3.4s ease-in-out infinite;
  }
  .bio{
    margin-top:8px; font-size:.92rem; line-height:1.55; color:var(--muted);
    max-width:320px; margin-inline:auto;
  }
  .bio .soon{ color:var(--sakura); font-style:italic; }

  /* ---------- status / presence pill ---------- */
  .status-pill{
    margin-top:18px; display:flex; align-items:center; gap:12px; text-align:left;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
    border-radius:16px; padding:10px 14px;
  }
  .mini-avatar{
    position:relative; width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #241a20, #0c0a0c 70%);
    border:2px solid rgba(255,179,198,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .mini-avatar svg{ width:44%; height:44%; }
  .mini-avatar svg polygon{ fill:none; stroke:var(--sakura); stroke-width:6; stroke-linejoin:round; }
  .mini-dot{
    position:absolute; bottom:-2px; right:-2px; width:12px; height:12px; border-radius:50%;
    background:var(--online); border:2px solid var(--bg-1); box-shadow:0 0 6px var(--online);
  }
  .status-main{ flex:1; min-width:0; }
  .status-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .status-name{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:.95rem; }
  .badge{
    display:inline-flex; align-items:center; gap:4px;
    font-family:'JetBrains Mono', monospace; font-size:.62rem; letter-spacing:.4px;
    padding:2px 7px; border-radius:6px; line-height:1.6;
  }
  .badge.arch{ background:rgba(255,179,198,.12); color:var(--sakura); border:1px solid rgba(255,179,198,.25); }
  .badge.verified{ background:rgba(255,225,233,.08); color:var(--sakura-pale); border:1px solid rgba(255,225,233,.2); }
  .status-sub{
    margin-top:3px; display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:.74rem; color:var(--muted);
    white-space:nowrap; overflow:hidden;
  }
  .status-sub svg{ flex-shrink:0; }
  .status-text{ overflow:hidden; text-overflow:ellipsis; }
  .cursor-blink{
    display:inline-block; width:6px; height:12px; background:var(--sakura);
    flex-shrink:0; animation:blink 1s steps(2) infinite;
  }

  /* ---------- socials ---------- */
  .socials{ margin-top:18px; display:flex; justify-content:center; gap:12px; }
  .social-btn{
    width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
    color:var(--muted); display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; text-decoration:none;
    transition:transform .25s ease, background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .social-btn:hover{
    color:var(--bg-0); background:var(--sakura); border-color:var(--sakura);
    transform:translateY(-3px); box-shadow:0 8px 20px rgba(255,179,198,.35);
  }
  .social-btn:focus-visible{ outline:2px solid var(--sakura); outline-offset:3px; }

  .views{
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:.75rem; color:var(--muted-dim);
  }

  /* ---------- player card ---------- */
  .vinyl{
    position:relative; width:52px; height:52px; border-radius:50%; flex-shrink:0;
    background:repeating-radial-gradient(circle at 50% 50%, #1c161a 0 3px, #100c10 3px 6px);
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .vinyl::after{
    content:''; position:absolute; inset:0; margin:auto; width:16px; height:16px; border-radius:50%;
    background:var(--sakura); box-shadow:0 0 10px rgba(255,179,198,.5);
  }
  .vinyl.spinning{ animation:spin 3.2s linear infinite; }

  .track-info{ flex:1 1 170px; min-width:0; }
  .track-title{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:.88rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-artist{
    font-family:'JetBrains Mono', monospace; font-size:.7rem; color:var(--muted); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .progress-row{ display:flex; align-items:center; gap:8px; margin-top:7px; }
  .time{ font-family:'JetBrains Mono', monospace; font-size:.68rem; color:var(--muted-dim); flex-shrink:0; }
  .progress-track{ flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; border-radius:2px; background:linear-gradient(90deg, var(--sakura-deep), var(--sakura)); }

  .controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:auto; }
  .ctrl-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03); color:var(--white);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .2s ease, background .2s ease;
  }
  .ctrl-btn:hover{ background:rgba(255,179,198,.14); }
  .ctrl-btn:active{ transform:scale(.9); }
  .ctrl-btn:focus-visible{ outline:2px solid var(--sakura); outline-offset:2px; }
  .ctrl-btn.play{ width:38px; height:38px; background:var(--sakura); color:var(--bg-0); border-color:var(--sakura); }
  .ctrl-btn.play:hover{ background:var(--sakura-pale); }
  .ctrl-btn .icon-pause{ display:none; }
  .ctrl-btn.is-playing .icon-play{ display:none; }
  .ctrl-btn.is-playing .icon-pause{ display:inline-flex; }

  .footnote{
    margin-top:4px; font-family:'JetBrains Mono', monospace; font-size:.7rem;
    color:var(--muted-dim); opacity:.7; text-align:center;
  }

  /* ---------- motion ---------- */
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:1;} }
  @keyframes petalFall{
    0%{ transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.8; }
    92%{ opacity:.6; }
    100%{ transform:translateY(112vh) translateX(var(--drift,40px)) rotate(220deg); opacity:0; }
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes glowPulse{
    0%,100%{ text-shadow:0 0 14px rgba(255,179,198,.3); }
    50%{ text-shadow:0 0 26px rgba(255,179,198,.55); }
  }
  @keyframes pulseDot{
    0%,100%{ box-shadow:0 0 6px var(--online); }
    50%{ box-shadow:0 0 14px var(--online); }
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  @media (max-width:480px){
    body{ padding:52px 14px 36px; }
    .profile-card{ padding:0 18px 18px; }
    .avatar-box{ width:92px; height:92px; }
    .avatar-wrap{ margin-top:-42px; }
    .username{ font-size:1.4rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .star,.petal,.username,.cursor-blink,.avatar-dot,.mini-dot{ animation:none !important; }
    .card{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

  <div class="grain"></div>
  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>
  <svg class="mountains" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
    <polygon class="mtn-back" points="0,300 0,210 100,160 200,210 320,150 430,200 540,140 650,195 760,150 880,205 990,155 1100,200 1220,160 1330,205 1440,175 1440,300"></polygon>
    <polygon class="mtn-front" points="0,300 0,250 80,270 170,205 260,255 350,195 450,245 540,185 630,235 720,180 820,230 920,175 1020,225 1120,190 1220,240 1320,200 1420,235 1440,220 1440,300"></polygon>
  </svg>

  <main class="profile-wrap">

    <section class="card profile-card">
      <div class="avatar-wrap">
        <div class="avatar-box">
          <div class="avatar-ring">
            <div class="avatar">
              <svg class="hex-mark" viewBox="0 0 100 100" aria-hidden="true">
                <polygon points="50,6 90,28 90,72 50,94 10,72 10,28"></polygon>
              </svg>
            </div>
          </div>
          <span class="avatar-dot" title="Online"></span>
        </div>
      </div>

      <h1 class="username">Hpyrland</h1>
      <p class="bio">Arch Linux enjoyer. Running Hyprland <span class="soon">(soon™)</span>. Building something cool, one config at a time.</p>

      <div class="status-pill">
        <div class="mini-avatar">
          <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 90,28 90,72 50,94 10,72 10,28"></polygon></svg>
          <span class="mini-dot"></span>
        </div>
        <div class="status-main">
          <div class="status-top">
            <span class="status-name">Hpyrland</span>
            <span class="badge arch">ARCH</span>
            <span class="badge verified">
              <svg viewBox="0 0 24 24" width="10" height="10" aria-hidden="true"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              verified
            </span>
          </div>
          <div class="status-sub">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true">
              <path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="1" y="14" width="6" height="7" rx="2"/><rect x="17" y="14" width="6" height="7" rx="2"/>
            </svg>
            <span class="status-text">now playing: lofi hyprland beats</span>
            <span class="cursor-blink"></span>
          </div>
        </div>
      </div>

      <nav class="socials" aria-label="Social links">
        <a class="social-btn" href="https://github.com/Hpyrland" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a class="social-btn" href="#" target="_blank" rel="noopener" aria-label="Twitch"><i class="fa-brands fa-twitch"></i></a>
        <a class="social-btn" href="https://hpyrland.github.io/" aria-label="Home"><i class="fa-solid fa-house"></i></a>
      </nav>

      <div class="views">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="viewCount">0</span>
      </div>
    </section>

    <section class="card player-card">
      <div class="vinyl" id="vinyl"></div>
      <div class="track-info">
        <p class="track-title">lofi beats to rice hyprland to</p>
        <p class="track-artist">chillhop dev radio</p>
        <div class="progress-row">
          <span class="time" id="elapsed">0:00</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <span class="time" id="total">0:29</span>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="transform:scaleX(-1)" aria-hidden="true"><path d="M6 5l10 7-10 7V5Zm12 0h2v14h-2V5Z"/></svg>
        </button>
        <button class="ctrl-btn play" id="playBtn" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M6 5l10 7-10 7V5Zm12 0h2v14h-2V5Z"/></svg>
        </button>
      </div>
    </section>

    <p class="footnote">⬡ crafted for hpyrland.github.io</p>
  </main>

<script>
  // ---- starfield ----
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    const size = (Math.random() * 1.6 + 0.6).toFixed(2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top = (Math.random() * 68).toFixed(2) + '%';
    s.style.animationDuration = (Math.random() * 3 + 2).toFixed(2) + 's';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    starsEl.appendChild(s);
  }

  // ---- sakura petals ----
  const petalsEl = document.getElementById('petals');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.style.left = (Math.random() * 100).toFixed(2) + '%';
    p.style.setProperty('--drift', (Math.random() * 120 - 60).toFixed(0) + 'px');
    p.style.animationDuration = (Math.random() * 10 + 14).toFixed(2) + 's';
    p.style.animationDelay = (Math.random() * 18).toFixed(2) + 's';
    const scale = (Math.random() * 0.6 + 0.6).toFixed(2);
    p.style.transform = 'scale(' + scale + ')';
    petalsEl.appendChild(p);
  }

  // ---- view counter (cosmetic count-up, resets each visit — no persistence) ----
  function animateCount(el, target, duration) {
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      el.textContent = Math.floor(p * target);
      if (p < 1) requestAnimationFrame(tick); else el.textContent = target;
    }
    requestAnimationFrame(tick);
  }
  animateCount(document.getElementById('viewCount'), Math.floor(Math.random() * 60) + 15, 900);

  // ---- now-playing widget ----
  (function () {
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const vinyl = document.getElementById('vinyl');
    const fill = document.getElementById('progressFill');
    const elapsedEl = document.getElementById('elapsed');
    const totalSeconds = 29;
    let progress = 0;
    let playing = false;
    let timer = null;

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }
    function render() {
      fill.style.width = progress + '%';
      elapsedEl.textContent = fmt((progress / 100) * totalSeconds);
    }
    function tick() {
      progress += 100 / (totalSeconds * 4);
      if (progress >= 100) progress = 0;
      render();
    }
    function setPlaying(v) {
      playing = v;
      clearInterval(timer);
      if (playing) {
        vinyl.classList.add('spinning');
        timer = setInterval(tick, 250);
        playBtn.classList.add('is-playing');
        playBtn.setAttribute('aria-label', 'Pause');
      } else {
        vinyl.classList.remove('spinning');
        playBtn.classList.remove('is-playing');
        playBtn.setAttribute('aria-label', 'Play');
      }
    }
    playBtn.addEventListener('click', () => setPlaying(!playing));
    prevBtn.addEventListener('click', () => { progress = Math.max(0, progress - 15); render(); });
    nextBtn.addEventListener('click', () => { progress = Math.min(100, progress + 15); render(); });
    render();

    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!prefersReduced) setPlaying(true);
  })();
</script>
</body>
</html>
