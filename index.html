<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hpyrland</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(255,50,50,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,50,50,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .glitch {
      font-size: 5rem;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      animation: glitch 3s infinite;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
    }

    .glitch::before {
      color: #ff3333;
      animation: glitch-top 3s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }

    .glitch::after {
      color: #3333ff;
      animation: glitch-bottom 3s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-2px, 1px); }
      94% { transform: translate(2px, -1px); }
      96% { transform: translate(-1px, 2px); }
    }

    @keyframes glitch-top {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(3px, 0); }
      94% { transform: translate(-3px, 0); }
    }

    @keyframes glitch-bottom {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-3px, 0); }
      94% { transform: translate(3px, 0); }
    }

    .subtitle {
      margin-top: 1rem;
      font-size: 1rem;
      color: #ff3333;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff3333, transparent);
      margin: 2rem auto;
      opacity: 0;
      animation: fadeIn 1s ease 1s forwards;
    }

    .tags {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards;
    }

    .tag {
      border: 1px solid #ff3333;
      color: #ff3333;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      cursor: default;
    }

    .tag:hover {
      background: #ff3333;
      color: #0d0d0d;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background: #ff3333;
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .terminal-line {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #555;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }

    .terminal-line span {
      color: #ff3333;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .social-links {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s ease 2.5s forwards;
    }

    .social-links a {
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #ff3333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glitch" data-text="HPYRLAND">HPYRLAND</div>
    <p class="subtitle">Linux Enjoyer &bull; Terminal Ricer &bull; PC Gamer</p>
    <div class="divider"></div>
    <div class="tags">
      <div class="tag">Arch Linux</div>
      <div class="tag">WSL</div>
      <div class="tag">Counter-Strike</div>
      <div class="tag">Open Source</div>
    </div>
    <p class="terminal-line"><span>~</span> building something cool<span class="cursor"></span></p>
    <div class="social-links">
      <a href="https://github.com/Hpyrland" target="_blank">GitHub</a>
    </div>
  </div>
</body>
</html>
